# Nginx Reverse Proxy Configuration for ATS Resume Analyzer on AWS EC2
# Place at /etc/nginx/conf.d/ats-app.conf or /etc/nginx/sites-available/ats-app

server {
    listen 80;
    listen [::]:80;
    server_name _; # Replace with EC2 public DNS or custom Route 53 domain name

    # Increase maximum allowed upload size for resume files (PDF, DOCX)
    client_max_body_size 15M;

    # Gzip Compression for fast delivery of static assets and JSON responses
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied expired no-cache no-store private auth;
    gzip_types text/plain text/css text/xml text/javascript application/javascript application/json application/xml;

    # Security Headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer-when-downgrade" always;

    # Static assets caching
    location ~* \.(css|js|ico|png|jpg|jpeg|gif|svg)$ {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_cache_valid 200 30d;
        expires 30d;
        add_header Cache-Control "public, no-transform";
    }

    # Reverse proxy to Node.js backend
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;

        # WebSocket support (if enabled in future)
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';

        # Forward real client IP and host
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Timeouts for document parsing and S3 upload
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;

        # Disable caching for dynamic API responses
        proxy_cache_bypass $http_upgrade;
    }

    # Health check bypass for AWS Application Load Balancer
    location /api/health {
        proxy_pass http://127.0.0.1:3000/api/health;
        proxy_set_header Host $host;
        access_log off;
    }
}
